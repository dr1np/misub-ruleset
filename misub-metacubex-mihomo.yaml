# Mihomo 由上至下首条匹配生效。
rules:
  # 局域网地址先直连。
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # 原生 Claude 桌面端/CLI：补足共享 CDN、新域名和自定义 API 的进程请求。
  # 不匹配 node、浏览器、git 等通用进程，避免接管其他应用。
  - 'PROCESS-NAME-REGEX,(?i)^(claude(\.exe)?|claude-desktop|claude helper( \((renderer|gpu|plugin)\))?)$,Claude'
  - 'AND,((NETWORK,udp),(PROCESS-NAME-REGEX,(?i)^(claude(\.exe)?|claude-desktop|claude helper( \((renderer|gpu|plugin)\))?)$)),REJECT'

  # Claude 优先于广告、Google 和其他 AI，登录、内容与功能开关使用同一出口。
  - RULE-SET,claude_extra_domain,Claude
  - AND,((NETWORK,udp),(RULE-SET,claude_extra_domain)),REJECT
  - RULE-SET,claude_domain,Claude
  - AND,((NETWORK,udp),(RULE-SET,claude_domain)),REJECT

  # Steam 细分先于通用域名规则；选中的节点不支持 UDP 时拒绝继续匹配。
  - RULE-SET,steam_download,Steam 下载与更新
  - AND,((NETWORK,udp),(RULE-SET,steam_download)),REJECT
  - RULE-SET,steam_client,Steam 登录与好友
  - AND,((NETWORK,udp),(RULE-SET,steam_client)),REJECT
  - RULE-SET,steam_community,Steam 社区
  - AND,((NETWORK,udp),(RULE-SET,steam_community)),REJECT
  - RULE-SET,steam_store,Steam 商店
  - AND,((NETWORK,udp),(RULE-SET,steam_store)),REJECT

  # 其余广告优先于国内与服务分类，默认 REJECT。
  - RULE-SET,ads_domain,广告拦截

  # 独立服务优先于其他 AI 和国内分类；UDP 不支持时拒绝，避免落入其他分组。
  - RULE-SET,openai_domain,OpenAI
  - AND,((NETWORK,udp),(RULE-SET,openai_domain)),REJECT
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - AND,((NETWORK,udp),(RULE-SET,google_domain)),REJECT

  # 其余服务流量交给各自分组，默认使用“通用代理”。
  - RULE-SET,other_ai_domain,其他AI
  - RULE-SET,github_domain,GitHub
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,netflix_domain,流媒体
  - RULE-SET,disney_domain,流媒体
  - RULE-SET,spotify_domain,流媒体
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,apple_domain,Apple

  # 服务分类优先；其余国内域名按 cn_domain 分类直连。
  - RULE-SET,cn_domain,国内服务

  # 国外域名先于 IP 规则；不为判断 IP 归属而解析未知域名。
  - RULE-SET,geolocation_noncn,通用代理

  # 直接访问官方 API IP 时也使用 Claude 分组，不额外解析域名。
  - RULE-SET,claude_ip,Claude,no-resolve
  - AND,((NETWORK,udp),(RULE-SET,claude_ip,no-resolve)),REJECT

  # CM、语音或 Valve 中继可能直接连 IP；不解析域名来判断是否属于 Valve。
  - AND,((NOT,((DOMAIN-REGEX,.+))),(RULE-SET,steam_valve_ip,no-resolve)),Steam 登录与好友
  - AND,((NETWORK,udp),(NOT,((DOMAIN-REGEX,.+))),(RULE-SET,steam_valve_ip,no-resolve)),REJECT

  # 未直连的域名 UDP：节点不支持 UDP 时必须拒绝，不能继续落到 IP 直连。
  - AND,((NETWORK,udp),(DOMAIN-REGEX,.+)),通用代理
  - AND,((NETWORK,udp),(DOMAIN-REGEX,.+)),REJECT
  - RULE-SET,cn_ip,国内服务,no-resolve
  - RULE-SET,google_ip,Google,no-resolve
  - AND,((NETWORK,udp),(RULE-SET,google_ip,no-resolve)),REJECT

  # IP 形式的其余 UDP 同样先尝试代理、不支持则拒绝。
  # Mihomo 会跳过不支持 UDP 的代理规则，不能让它走到隐式 DIRECT。
  - NETWORK,udp,通用代理
  - NETWORK,udp,REJECT

  # 所有其余 TCP/UDP 流量交给“通用代理”，仅手动选择 DIRECT 时直连。
  - MATCH,通用代理
