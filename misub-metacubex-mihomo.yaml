    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,steamserver.net
      - DOMAIN-SUFFIX,steam-chat.com
      - DOMAIN-SUFFIX,steamconnecttest.com
      - DOMAIN,api.steampowered.com
      - DOMAIN,login.steampowered.com
