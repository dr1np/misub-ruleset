# MiSub >= v2.7 / Mihomo: 远程 Clash YAML 配置模板
# 用法：将此文件托管为可被 MiSub 访问的 HTTPS 原始文本 URL，
#       在订阅组中使用“内置转换引擎 + 自定义模板 URL”。
# 警告：不要把此文件当作“节点订阅”导入 MiSub。
# 节点 proxies 由 MiSub 在生成订阅时自动注入，无须在此硬编码。

mixed-port: 7890
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true

proxy-groups:
  - name: 通用代理
    type: select
    proxies: [自动选择, DIRECT]
    include-all: true

  - name: 自动选择
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 关键：OpenAI 与 Google 是独立策略组。导入后分别手动指定出口。
  - name: OpenAI
    type: select
    proxies: [通用代理, 自动选择, DIRECT]
    include-all: true

  - name: Google
    type: select
    proxies: [通用代理, 自动选择, DIRECT]
    include-all: true

  - name: YouTube
    type: select
    proxies: [Google, 通用代理, DIRECT]

  - name: 其他AI
    type: select
    proxies: [通用代理, 自动选择, DIRECT]
    include-all: true

  - name: GitHub
    type: select
    proxies: [通用代理, 自动选择, DIRECT]

  - name: Telegram
    type: select
    proxies: [通用代理, 自动选择, DIRECT]

  - name: 流媒体
    type: select
    proxies: [通用代理, 自动选择, DIRECT]

  - name: Microsoft
    type: select
    proxies: [DIRECT, 通用代理]

  - name: Apple
    type: select
    proxies: [DIRECT, 通用代理]

  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

  - name: 国内服务
    type: select
    proxies: [DIRECT, 通用代理]

  - name: 漏网之鱼
    type: select
    proxies: [通用代理, DIRECT]

# 自动更新规则集，使用 MRS 二进制格式。
# 若 Github Raw 在你的运行环境不可访问，替换为可信的 GitHub 镜像。
rule-providers:
  private_domain:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/mcx-private-domain.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs
    interval: 86400
  private_ip:
    type: http
    behavior: ipcidr
    format: mrs
