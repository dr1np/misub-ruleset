# Mihomo 由上至下首条匹配生效。
rules:
  # 局域网地址先直连。
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # 国内域名按 cn_domain 分类直连，不由 DNS 返回的 IP 推断域名归属。
  - RULE-SET,cn_domain,国内服务

  # 未命中国内域名库的服务流量统一交给“通用代理”。
  - RULE-SET,openai_domain,OpenAI
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,other_ai_domain,其他AI
  - RULE-SET,github_domain,GitHub
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,netflix_domain,流媒体
  - RULE-SET,disney_domain,流媒体
  - RULE-SET,spotify_domain,流媒体
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,apple_domain,Apple

  # 广告默认走代理，可选阻断，不能选择直连。
  - RULE-SET,ads_domain,广告拦截

  # 国外域名先于 IP 规则；不为判断 IP 归属而解析未知域名。
  - RULE-SET,geolocation_noncn,通用代理

  # 未直连的域名 UDP：节点不支持 UDP 时必须拒绝，不能继续落到 IP 直连。
  - AND,((NETWORK,udp),(DOMAIN-REGEX,.+)),通用代理
  - AND,((NETWORK,udp),(DOMAIN-REGEX,.+)),REJECT
  - RULE-SET,cn_ip,国内服务,no-resolve
  - RULE-SET,google_ip,Google,no-resolve

  # IP 形式的其余 UDP 同样先尝试代理、不支持则拒绝。
  # Mihomo 会跳过不支持 UDP 的代理规则，不能让它走到隐式 DIRECT。
  - NETWORK,udp,通用代理
  - NETWORK,udp,REJECT

  # 所有其余 TCP/UDP 流量都走手动指定的海外节点，绝不兜底直连。
  - MATCH,通用代理
