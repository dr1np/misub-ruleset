# MiSub >= v2.7 / Mihomo: 远程 Clash YAML 配置模板
# 用法：将此文件托管为可被 MiSub 访问的 HTTPS 原始文本 URL，
#       在订阅组中使用“内置转换引擎 + 自定义模板 URL”。
# 警告：不要把此文件当作“节点订阅”导入 MiSub。
# 节点 proxies 由 MiSub 在生成订阅时自动注入，无须在此硬编码。

mixed-port: 7890
mode: rule
ipv6: false
log-level: info
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true

# 客户端须启用 TUN/服务模式；Clash Verge 的界面设置优先于模板。
# 严格路由限制 Windows 多网卡 DNS 绕行，但不等于内核退出后的系统断网开关。
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

# 关闭客户端 DNS 覆写，使用这里的 DNS 设置。
# 公网域名统一通过“通用代理”加密解析，国内网站的连接仍可按规则直连。
# 只有代理节点自身的域名需要独立解析，才能在代理建立前完成引导。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "geosite:private"
    - "geosite:category-ntp"
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "localhost"
  use-hosts: true
  use-system-hosts: true

  # 显式指定 DNS 传输代理，避免 DNS 自己递归触发路由解析。
  respect-rules: false

  # 使用 IP 地址形式的加密引导 DNS，不使用 system 或明文公网 DNS。
  default-nameserver:
    - "https://223.5.5.5/dns-query"

  # 仅查询代理节点域名，显式直连，不能通过尚未建立的代理查询自身。
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"

  # 直连网站也通过代理解析，不因切换到 DIRECT 而改用国内 DNS。
  direct-nameserver:
    - "https://1.1.1.1/dns-query#通用代理"
    - "https://8.8.8.8/dns-query#通用代理"
  direct-nameserver-follow-policy: false

  # 两个加密 DNS 都经过同一个手动选择的海外节点，没有直连回退。
  nameserver:
    - "https://1.1.1.1/dns-query#通用代理"
    - "https://8.8.8.8/dns-query#通用代理"
  fallback: []

  # 不设置 geosite:cn 国内 DNS 分流，避免国外域名因分类重叠被送往国内 DNS。
  nameserver-policy: {}

proxy-groups:
  - name: 通用代理
    type: select
    # 首次导入先阻断，请手动选定海外节点；节点消失后也先阻断。
    proxies: [REJECT]
    include-all: true
    exclude-type: "Direct|Compatible|Pass"
    empty-fallback: REJECT

  # 保留服务分类，但海外出口全部锁定到“通用代理”，不再独立选节点。
  - name: OpenAI
    type: select
    proxies: [通用代理]

  - name: Google
    type: select
    proxies: [通用代理]

  - name: YouTube
    type: select
    proxies: [通用代理]

  - name: 其他AI
    type: select
    proxies: [通用代理]

  - name: GitHub
    type: select
    proxies: [通用代理]

  - name: Telegram
    type: select
    proxies: [通用代理]

  - name: 流媒体
    type: select
    proxies: [通用代理]

  - name: Microsoft
    type: select
    proxies: [通用代理]

  - name: Apple
    type: select
    proxies: [通用代理]

  - name: 广告拦截
    type: select
    # 默认按海外流量处理；需要拦截时可手动选择 REJECT。
    proxies: [通用代理, REJECT]

  - name: 国内服务
    type: select
    proxies: [DIRECT]

# 自动更新规则集，使用 MRS 二进制格式。
# 若 Github Raw 在你的运行环境不可访问，替换为可信的 GitHub 镜像。
rule-providers:
  private_domain:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/mcx-private-domain.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs
    interval: 86400
  private_ip:
    type: http
    behavior: ipcidr
    format: mrs
    path: ./ruleset/mcx-private-ip.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs
