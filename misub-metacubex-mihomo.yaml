  steam_download:
    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,steamcontent.com
      - DOMAIN-SUFFIX,cs.steampowered.com
      - DOMAIN,client-download.steampowered.com
      - DOMAIN,repo.steampowered.com
