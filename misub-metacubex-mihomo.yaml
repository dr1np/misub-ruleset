# MiSub >= v2.7 / Mihomo: 远程 Clash YAML 配置模板
# 用法：将此文件托管为可被 MiSub 访问的 HTTPS 原始文本 URL，
#       在订阅组中使用“内置转换引擎 + 自定义模板 URL”。
# 警告：不要把此文件当作“节点订阅”导入 MiSub。
# 节点 proxies 由 MiSub 在生成订阅时自动注入，无须在此硬编码。

mixed-port: 7890
mode: rule
ipv6: false
log-level: info
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true

# 客户端须启用 TUN/服务模式；Clash Verge 的界面设置优先于模板。
# 严格路由限制 Windows 多网卡 DNS 绕行，但不等于内核退出后的系统断网开关。
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

# 关闭客户端 DNS 覆写，使用这里的 DNS 设置。
# 公网域名统一通过“通用代理”加密解析，国内网站的连接仍可按规则直连。
# 只有代理节点自身的域名需要独立解析，才能在代理建立前完成引导。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "geosite:private"
    - "geosite:category-ntp"
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "localhost"
  use-hosts: true
  use-system-hosts: true

  # 显式指定 DNS 传输代理，避免 DNS 自己递归触发路由解析。
  respect-rules: false

  # 使用 IP 地址形式的加密引导 DNS，不使用 system 或明文公网 DNS。
  default-nameserver:
    - "https://223.5.5.5/dns-query"

  # 仅查询代理节点域名，显式直连，不能通过尚未建立的代理查询自身。
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"

  # 直连网站也通过代理解析，不因切换到 DIRECT 而改用国内 DNS。
  direct-nameserver:
    - "https://1.1.1.1/dns-query#通用代理"
    - "https://8.8.8.8/dns-query#通用代理"
  direct-nameserver-follow-policy: false

  # 两个加密 DNS 都经过“通用代理”的当前选择，没有自动直连回退。
  nameserver:
    - "https://1.1.1.1/dns-query#通用代理"
    - "https://8.8.8.8/dns-query#通用代理"
  fallback: []

  # 不设置 geosite:cn 国内 DNS 分流，避免国外域名因分类重叠被送往国内 DNS。
  nameserver-policy: {}

proxy-groups:
  - name: 通用代理
    type: select
    # 首次导入先阻断，请手动选定海外节点；节点消失后也先阻断。
    proxies: [REJECT, DIRECT]
    include-all: true
    exclude-type: "Compatible|Pass"
    empty-fallback: REJECT

  # 三个服务组默认跟随“通用代理”，也可独立选节点。
  - name: Claude
    type: select
    proxies: [通用代理, REJECT]
    include-all: true
    exclude-type: "Direct|Compatible|Pass"
    empty-fallback: REJECT

  - name: OpenAI
    type: select
    proxies: [通用代理, REJECT]
    include-all: true
    exclude-type: "Direct|Compatible|Pass"
    empty-fallback: REJECT

  - name: Google
    type: select
    proxies: [通用代理, REJECT]
    include-all: true
    exclude-type: "Direct|Compatible|Pass"
    empty-fallback: REJECT

  - name: YouTube
    type: select
    proxies: [通用代理, REJECT, DIRECT]

  - name: 其他AI
    type: select
    proxies: [通用代理, REJECT, DIRECT]

  - name: GitHub
    type: select
    proxies: [通用代理, REJECT, DIRECT]

  - name: Telegram
    type: select
    proxies: [通用代理, REJECT, DIRECT]

  - name: 流媒体
    type: select
    proxies: [通用代理, REJECT, DIRECT]

  - name: Steam 登录与好友
    type: select
    proxies: [DIRECT, 通用代理, REJECT]
    include-all: true
    exclude-type: "Compatible|Pass"

  - name: Steam 下载与更新
    type: select
    proxies: [DIRECT, 通用代理, REJECT]
    include-all: true
    exclude-type: "Compatible|Pass"

  - name: Steam 商店
    type: select
    proxies: [通用代理, DIRECT, REJECT]
    include-all: true
    exclude-type: "Compatible|Pass"

  - name: Steam 社区
    type: select
    proxies: [通用代理, DIRECT, REJECT]
    include-all: true
    exclude-type: "Compatible|Pass"

  - name: Microsoft
    type: select
    proxies: [通用代理, REJECT, DIRECT]

  - name: Apple
    type: select
    proxies: [通用代理, REJECT, DIRECT]

  - name: 广告拦截
    type: select
    # 首次导入默认拦截；也可手动选择代理或直连。
    proxies: [REJECT, 通用代理, DIRECT]

  - name: 国内服务
    type: select
    proxies: [DIRECT, REJECT]

# 远程规则集自动更新，使用 MRS 二进制格式；Claude 和 Steam 的细分规则内置于模板。
# 若 Github Raw 在你的运行环境不可访问，替换为可信的 GitHub 镜像。
rule-providers:
  # Steam 的专用主机先匹配，剩余的 steampowered/steamstatic 域名归商店。
